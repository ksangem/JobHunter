# ============================================================================
# JobHunter — local infrastructure (Phase 1 foundation).
# PostgreSQL 16 · Redis 7 · Kafka (KRaft) · MinIO (S3) · Temporal.
# Bring up:  docker compose -f infra/docker/docker-compose.yml up -d
# ============================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: jh-postgres
    environment:
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: jobhunter
      POSTGRES_DB: jobhunter
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jobhunter']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jh-redis
    ports: ['6379:6379']
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['redisdata:/data']

  kafka:
    image: bitnami/kafka:3.7
    container_name: jh-kafka
    ports: ['9092:9092']
    environment:
      KAFKA_CFG_NODE_ID: '1'
      KAFKA_CFG_PROCESS_ROLES: 'broker,controller'
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_CFG_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
      KAFKA_CFG_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      ALLOW_PLAINTEXT_LISTENER: 'yes'
    volumes: ['kafkadata:/bitnami/kafka']

  minio:
    image: minio/minio:latest
    container_name: jh-minio
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']

  temporal:
    image: temporalio/auto-setup:1.25
    container_name: jh-temporal
    depends_on: [postgres]
    environment:
      DB: postgres12
      DB_PORT: '5432'
      POSTGRES_USER: jobhunter
      POSTGRES_PWD: jobhunter
      POSTGRES_SEEDS: postgres
    ports: ['7233:7233']

  temporal-ui:
    image: temporalio/ui:2.31.2
    container_name: jh-temporal-ui
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ['8080:8080']

volumes:
  pgdata:
  redisdata:
  kafkadata:
  miniodata:
